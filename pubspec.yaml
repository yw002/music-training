name: interval_ear
description: 音程听辨训练
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^4.1.4
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
